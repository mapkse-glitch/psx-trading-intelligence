services:
  - type: web
    name: psx-trading-intelligence
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python3 -m uvicorn psx_app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: GITHUB_SYNC_REPO
        sync: false
      - key: GITHUB_SYNC_TOKEN
        sync: false
      - key: GITHUB_SYNC_BRANCH
        value: "main"
