name: Import existing SQLite snapshot into empty PostgreSQL
on:
  workflow_dispatch:
    inputs:
      upload_id:
        description: Private dashboard upload ID (preferred; do not commit financial snapshots)
        required: false
        type: string
      total_chunks:
        description: Number of private staged upload chunks
        required: false
        default: '0'
        type: string
      expected_sha256:
        description: SHA256 of the compressed snapshot (required for private staged uploads)
        required: false
        type: string
      snapshot_path:
        description: Alternative trusted snapshot ALREADY in repository; never publish private data for this
        required: false
        type: string
      confirm:
        description: Type IMPORT_INTO_EMPTY_DATABASE to authorize the one-time copy
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: psx-postgres-migration
  cancel-in-progress: false
jobs:
  migrate:
    if: inputs.confirm == 'IMPORT_INTO_EMPTY_DATABASE'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PSX_DATABASE_BACKEND: postgres
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
      UPLOAD_ID: ${{ inputs.upload_id }}
      TOTAL_CHUNKS: ${{ inputs.total_chunks }}
      EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
      SNAPSHOT_PATH: ${{ inputs.snapshot_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned database driver
        run: pip install 'psycopg[binary]==3.2.12'
      - name: Verify source and migrate into empty target
        run: |
          python - <<'PY'
          import os, json
          from pathlib import Path
          try:
              if os.environ.get('UPLOAD_ID'):
                  from tools.migrate_staged_snapshot import migrate_staged
                  result=migrate_staged(os.environ['UPLOAD_ID'],int(os.environ['TOTAL_CHUNKS']),os.environ['EXPECTED_SHA256'])
              else:
                  from tools.import_sqlite_to_postgres import migrate
                  root=Path.cwd().resolve()
                  name=os.environ.get('SNAPSHOT_PATH','').strip()
                  path=(root/name).resolve()
                  if not name or not path.is_relative_to(root) or not path.is_file():
                      raise ValueError('Select a private staged upload or an existing trusted repository snapshot.')
                  result=migrate(path,confirm=True)
              print(json.dumps(result))
          except Exception:
              raise SystemExit('Migration did not report success. Check target counts before retrying; credentials are not printed.') from None
          PY
