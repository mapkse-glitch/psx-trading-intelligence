  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="psx-build-version" content="1.3.42" />
  <script>
    // Restore both independent preferences before first paint; unavailable storage is safe.
    (() => {
      let design = 'classic', theme;
      try { design = localStorage.getItem('psx_design') === 'neumorphic' ? 'neumorphic' : 'classic'; theme = localStorage.getItem('psx_theme'); } catch (_) {}
      if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.design = design;
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <title>PSX Trading Intelligence Dashboard — PostgreSQL Dashboard</title>
  <link rel="stylesheet" href="/styles.css?v=1.3.42" />
</head>

        </div>
        <div class="sidebar-meta" id="sidebarLastImport">Historical imports · Not a live feed</div>

    <!-- Main Workspace Area -->
    <main class="main-area">
      <!-- Top Bar -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="btn btn-secondary menu-toggle" id="menuToggle" aria-controls="sidebar" aria-expanded="false" onclick="toggleMenu()">Menu</button>
          <img class="mobile-mark1333" src="/psx-official-mark1331.png?v=1.3.41" alt="" aria-hidden="true" /><h2 id="viewTitle">01 • Overview &amp; Trading Intelligence</h2>
          <span class="feed-badge" id="feedStatusBadge">IMPORTED / END-OF-DAY</span>
        </div>
        <div class="topbar-right">
          <button class="btn btn-secondary desktop-utility" id="themeToggle" data-mode-toggle onclick="toggleTheme()" aria-label="Change colour mode">Theme</button>
          <button class="btn btn-secondary desktop-utility" type="button" data-design-toggle aria-label="Neumorphism" aria-pressed="false" onclick="toggleDesign()">Neumorphism: Off</button>
          <button class="btn btn-secondary desktop-utility" onclick="refreshCurrentView()" title="Clear client cache and reload current section">Refresh</button>
          <button class="btn btn-secondary" onclick="switchView('import')">Import</button>
          <button class="btn btn-primary" onclick="exportCurrentModule()">Export</button>
          <details class="mobile-utilities"><summary class="btn btn-secondary">More</summary><div><button class="btn btn-secondary" data-mode-toggle onclick="toggleTheme()">Change colour mode</button><button class="btn btn-secondary" type="button" data-design-toggle aria-label="Neumorphism" aria-pressed="false" onclick="toggleDesign()">Neumorphism: Off</button><button class="btn btn-secondary" onclick="refreshCurrentView()">Refresh data</button></div></details>
        </div>
      </header>

      <!-- Toast Notification Banner -->

      <!-- Dynamic View Container -->

      <div id="viewContainer" class="view-container" tabindex="-1">
        <div class="skeleton-card">Loading PSX Trading Intelligence Dashboard...</div>
