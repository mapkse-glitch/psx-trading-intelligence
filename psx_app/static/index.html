<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="psx-build-version" content="1.3.12" />
  <title>PSX Trading Intelligence Dashboard — Local-First Terminal</title>
  <link rel="stylesheet" href="/styles.css?v=1.3.12" />
</head>
<body>
  <a class="skip-link" href="#viewContainer">Skip to workspace</a>
  <button class="drawer-backdrop" aria-label="Close navigation" onclick="toggleMenu(false)" hidden></button>
  <div class="app-shell" id="appShell">
    <!-- Workspace sidebar (module downloads stay inside each module) -->
    <aside class="sidebar" id="sidebar" aria-label="Workspace navigation">
      <div class="brand-header">
        <div class="brand-logo">PSX</div>
        <div class="brand-titles">
          <h1>PSX Intelligence</h1>
          <span>Trading workspace · v1.3.12</span>
        </div>
      </div>

      <div class="sidebar-group-label">WORKSPACE</div>
      <nav class="sidebar-nav" id="sidebarNav">
        <button class="nav-btn active" data-view="overview">
          <span class="nav-num">01</span>
          <span class="nav-label">Overview</span>
        </button>
        <button class="nav-btn" data-view="import">
          <span class="nav-num">02</span>
          <span class="nav-label">Import and Update Center</span>
        </button>
        <button class="nav-btn" data-view="top5">
          <span class="nav-num">03</span>
          <span class="nav-label">Top 5 Volume &amp; Rate Register</span>
        </button>
        <button class="nav-btn" data-view="acc91404">
          <span class="nav-num">04</span>
          <span class="nav-label">Account 91404 Performance</span>
        </button>
        <button class="nav-btn" data-view="acc91269">
          <span class="nav-num">05</span>
          <span class="nav-label">Account 91269 Performance</span>
        </button>
        <button class="nav-btn" data-view="futures">
          <span class="nav-num">06</span>
          <span class="nav-label">Futures Comparison &amp; Annualized</span>
        </button>
        <button class="nav-btn" data-view="technical">
          <span class="nav-num">07</span>
          <span class="nav-label">Technical Analysis &amp; 36-Ticker</span>
        </button>
        <button class="nav-btn" data-view="reconciliation">
          <span class="nav-num">08</span>
          <span class="nav-label">Data Quality &amp; Reconciliation</span>
        </button>
        <button class="nav-btn" data-view="market"><span class="nav-num">09</span><span class="nav-label">Market Explorer</span></button>
        <button class="nav-btn" data-view="settings">
          <span class="nav-num">10</span>
          <span class="nav-label">Settings and Backup</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="status-pill">
          <span class="dot"></span>
          <span id="sidebarDbStatus">Checking database…</span>
        </div>
        <div class="sidebar-meta" id="sidebarLastImport">Historical imports · Not a live feed</div>
      </div>
    </aside>

    <!-- Main Workspace Area -->
    <main class="main-area">
      <!-- Top Bar -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="btn btn-secondary menu-toggle" id="menuToggle" aria-controls="sidebar" aria-expanded="false" onclick="toggleMenu()">Menu</button>
          <h2 id="viewTitle">01 • Overview &amp; Trading Intelligence</h2>
          <span class="feed-badge" id="feedStatusBadge">IMPORTED / END-OF-DAY</span>
        </div>
        <div class="topbar-right">
          <button class="btn btn-secondary desktop-utility" id="themeToggle" onclick="toggleTheme()" aria-label="Change colour theme">Theme</button>
          <button class="btn btn-secondary desktop-utility" onclick="refreshCurrentView()" title="Clear client cache and reload current section">Refresh</button>
          <button class="btn btn-secondary" onclick="switchView('import')">Import</button>
          <button class="btn btn-primary" onclick="exportCurrentModule()">Export</button>
          <details class="mobile-utilities"><summary class="btn btn-secondary">More</summary><div><button class="btn btn-secondary" onclick="toggleTheme()">Change theme</button><button class="btn btn-secondary" onclick="refreshCurrentView()">Refresh data</button></div></details>
        </div>
      </header>

      <!-- Toast Notification Banner -->
      <div id="toastBanner" class="toast-banner hidden" role="status" aria-live="polite"></div>

      <div id="dataFreshnessNotice" class="toast-banner hidden" role="alert"></div>

      <!-- Dynamic View Container -->
      <div id="viewContainer" class="view-container" tabindex="-1">
        <div class="skeleton-card">Loading PSX Trading Intelligence Dashboard...</div>
      </div>
    </main>
  </div>

  <script src="/table_display.js?v=1.3.12"></script>
  <script src="/app.js?v=1.3.12"></script>
  <script src="/display1311.js?v=1.3.12"></script>
  <script src="/upgrade139.js?v=1.3.12"></script>
</body>
</html>
